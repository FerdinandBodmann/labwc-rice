# Ultimate Labwc Rice - xdg-desktop-portal routing for labwc
#
# WHY THIS FILE EXISTS
#
# The labwc package ships /usr/share/xdg-desktop-portal/labwc-portals.conf with
#     [preferred]
#     default=wlr;*
# The wlr backend only implements ScreenCast and Screenshot. For every other
# interface the '*' fallback resolved to the GNOME backend (alphabetically the
# first backend that implements them) - and that backend cannot start outside a
# GNOME session. The result was a flooded journal and, more importantly, no file
# dialogs at all:
#
#     Backend call failed: Could not activate remote peer
#     'org.freedesktop.impl.portal.desktop.gnome': startup job failed
#
# Flatpak apps (Brave, Discord, Teams, ...) are always sandboxed, so they *must*
# ask the portal for open/save dialogs - which is why saving/uploading in the
# browser silently did nothing.
#
# WHAT THIS DOES
#
# This user-level file (highest precedence, see portals.conf(5)) overrides the
# package default:
#   - gtk handles FileChooser, Settings, Notification, Print, AppChooser, ...
#   - wlr keeps ScreenCast/Screenshot (that is what it is good at)
#   - Secret stays with gnome-keyring (falls back to kwallet)
#   - Inhibit stays disabled, matching the labwc package default
#
# Applied by install.sh to ~/.config/xdg-desktop-portal/labwc-portals.conf.
# After changing it, run:  systemctl --user restart xdg-desktop-portal

[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring;kwallet;
org.freedesktop.impl.portal.Inhibit=none

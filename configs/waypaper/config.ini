# Ultimate Labwc Rice - waypaper (GUI wallpaper picker)
#
# waypaper rewrites this file whenever it saves a setting, so the rice ships it
# as a TEMPLATE: install.sh copies it to ~/.config/waypaper/config.ini only if
# that file does not exist yet. Anything you change in the GUI (folder, columns,
# fill mode, backend, sort) is written back here.
#
# The file lives outside the git repository on purpose: waypaper stores the
# currently selected wallpaper in it, and symlinking it would dirty the rice
# on every pick.
#
# Launch it with Super+Shift+w, or "Set Wallpaper..." in the desktop menu.

[Settings]
# UI language: en (English) or de (German). waypaper also ships fr, ru, pl, es,
# tr, jp, fi, pt-BR.
language = en

# Folders scanned for wallpapers (one per line). Images are shown as a
# thumbnail grid in which you can click the one you want.
folder = ~/Pictures/Wallpapers

# swaybg is installed and supports static images
backend = swaybg

# fill | stretch | fit | center | tile
fill = fill

# name | namerev | date | daterev | random
sort = name

# Colour of the "screen" behind the thumbnails (Catppuccin Mocha base)
color = #1e1e2e

# Thumbnails per row in the picker grid
number_of_columns = 4

show_hidden = false
subfolders = false
all_subfolders = false
show_gifs_only = false
show_path_in_tooltip = true

# Zen mode hides the top bar in the picker (toggle with Ctrl+Z there)
zen_mode = false

# Optional command run after a wallpaper is set (e.g. a notification):
post_command =

# Slideshow (disabled by default)
slideshow_enabled = false
slideshow_interval = 60
show_slideshow_panel = false
